name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install awks and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gawk mawk busybox shellcheck
      - name: shellcheck
        run: shellcheck -S warning -x scripts/which-key.sh which-key.tmux tests/*.sh themes/*.sh
      - name: gawk
        run: AWK=gawk tests/run.sh
      - name: gawk --posix
        run: AWK='gawk --posix' tests/run.sh
      - name: mawk
        run: AWK=mawk tests/run.sh
      - name: busybox awk
        run: AWK='busybox awk' tests/run.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 4+ (macOS ships 3.2)
        run: brew install bash && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: BSD awk
        run: AWK=/usr/bin/awk tests/run.sh
