# Fixture for tests/run.sh: tmux defaults plus one of each rule in scripts/menu.awk.
# After changing it, run tests/make-fixture.sh and check the diff of the expected files.

bind -r h resize-pane -L 5                                  # repeatable: popup stays open
bind -N "Open notes" n run-shell "~/bin/notes.sh"           # label from the note
bind R run-shell "~/bin/deploy-site.sh"                     # label from the script name
bind -T move h select-pane -L                               # tmux's own move table (prefix g) is a group
bind -T move , command-prompt "move-window -t '%%'"

set -g @which-key-group-g 'Git'                             # new group; takes g, so the move table moves
set -g @which-key-g-s 'Status : git status'
set -g @which-key-g-S 'Stash : git stash'
set -g @which-key-g-L 'Lazygit : popup:lazygit'
set -g @which-key-group-M 'Tools'
set -g @which-key-M-h 'Htop : popup:htop'
set -g @which-key-group-p 'Panes'                           # renames a live group
set -g @which-key-p-z none                                  # removes a live entry
set -g @which-key-p-Q 'Quote : tmux:display-message "a \"b\" $HOME; c"'
set -g @which-key-group-b none                              # removes a live group
set -g @which-key-root-f 'Files : run:yazi'                 # top-level entry
set -g @which-key-y-x 'Orphan : echo'                       # undeclared group: ignored
set -g @which-key-icons off
