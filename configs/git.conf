# Git group for tmux-which-key, sourced by which-key.tmux (turn off with set -g @which-key-extras none).
# set -o leaves alone anything already set in tmux.conf, so you can rename, change or remove ('none') any of these.
set -goq @which-key-group-g 'Git'
set -goq @which-key-g-s 'Status : git status'
set -goq @which-key-g-d 'Diff : git diff'
set -goq @which-key-g-D 'Diff staged : git diff --staged'
set -goq @which-key-g-l 'Log : git log --oneline --graph -20'
set -goq @which-key-g-b 'Branches : git branch -a'
set -goq @which-key-g-a 'Add (patch) : git add -p'
set -goq @which-key-g-c 'Commit : git commit'
set -goq @which-key-g-p 'Push : git push'
set -goq @which-key-g-P 'Pull : git pull'
set -goq @which-key-g-f 'Fetch all : git fetch --all'
set -goq @which-key-g-z 'Stash : git stash'
set -goq @which-key-g-Z 'Stash pop : git stash pop'
if-shell 'command -v lazygit >/dev/null' "set -goq @which-key-g-g 'Lazygit : popup:lazygit'"
